# WinCraft OS display server defaults.
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
    Option "DontZap"     "true"
EndSection

Section "InputClass"
    Identifier      "WinCraft touchpad"
    MatchIsTouchpad "on"
    Driver          "libinput"
    Option          "Tapping" "on"
EndSection
