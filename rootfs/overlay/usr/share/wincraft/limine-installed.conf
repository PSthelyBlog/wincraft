timeout: 2
quiet: no
interface_branding: WinCraft OS
interface_branding_colour: 4aa5f0
term_palette: 0a0f1e;e05561;8cc265;d18f52;4aa5f0;c162de;42b3c2;d7dae0
term_background: 000a0f1e
term_foreground: 00d7dae0

/WinCraft OS
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initramfs.img
    cmdline: wc.live quiet loglevel=3 net.ifnames=0 vt.global_cursor_default=0

/WinCraft OS (safe graphics)
    comment: Use the firmware framebuffer instead of a native graphics driver.
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initramfs.img
    cmdline: wc.live nomodeset quiet loglevel=3 net.ifnames=0 vt.global_cursor_default=0

/WinCraft OS (without your features)
    comment: Start without the features added to this computer, to repair one that keeps it from working.
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initramfs.img
    cmdline: wc.live wc.nofeatures quiet loglevel=3 net.ifnames=0 vt.global_cursor_default=0

/WinCraft OS (fresh session)
    comment: Start without your installed programs and settings (they are kept on disk).
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initramfs.img
    cmdline: wc.live wc.nodata quiet loglevel=3 net.ifnames=0 vt.global_cursor_default=0

/WinCraft OS (rescue shell)
    comment: Verbose boot with a root shell on the second console (Ctrl+Alt+F2) and the serial port.
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initramfs.img
    cmdline: wc.live wc.shell net.ifnames=0 console=ttyS0,115200 console=tty0
