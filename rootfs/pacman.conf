# pacman configuration used only at build time to stage the WinCraft root
# filesystem from Arch Linux binary packages. The shipped OS has no package
# manager: it is an immutable image.
[options]
Architecture = x86_64
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8
DisableSandbox
# Never unpack development files, documentation or translations.
NoExtract = usr/include/* usr/lib/pkgconfig/* usr/share/pkgconfig/* usr/lib/cmake/* usr/share/cmake/*
NoExtract = usr/lib/*.a usr/lib/*.la usr/lib/*.o !usr/lib/libc_nonshared.a
NoExtract = usr/share/doc/* usr/share/man/* usr/share/info/* usr/share/gtk-doc/* usr/share/help/*
NoExtract = usr/share/locale/* !usr/share/locale/locale.alias usr/share/i18n/*
NoExtract = usr/share/bash-completion/* usr/share/zsh/* usr/share/fish/*
NoExtract = usr/share/aclocal/* usr/share/vala/* usr/share/gir-1.0/* usr/lib/girepository-1.0/*
NoExtract = usr/share/wine/mono/* usr/share/wine/gecko/*

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
